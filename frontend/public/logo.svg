<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="nomadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="jetBody" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Travel Squircle -->
  <rect width="48" height="48" rx="14" fill="url(#nomadBg)" />
  <rect x="1" y="1" width="46" height="46" rx="13" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Global Longitude / Latitude Flight Arcs -->
  <path d="M8 32 C14 18, 26 12, 38 12" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" opacity="0.85" />
  <path d="M12 40 C20 38, 34 32, 40 20" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Waypoint Beacon -->
  <circle cx="38" cy="12" r="2.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="38" cy="12" r="4.5" stroke="#ffffff" stroke-width="1" opacity="0.5" />

  <!-- Supersonic Travel Jet In Flight -->
  <g transform="translate(4, 3)">
    <path d="M30.2 10.8 C31.4 9.6, 33.2 10.2, 33.2 11.8 C33.2 12.8, 32.5 13.7, 31.8 14.4 L26.5 19.7 L29.5 31.5 C29.7 32.3, 28.9 33.0, 28.2 32.5 L24.2 27.8 L19.5 32.5 L19.8 35.5 C19.9 36.1, 19.2 36.6, 18.6 36.2 L16.2 33.8 L13.8 31.4 C13.4 30.8, 13.9 30.1, 14.5 30.2 L17.5 30.5 L22.2 25.8 L17.5 21.8 C17.0 21.1, 17.7 20.3, 18.5 20.5 L30.3 23.5 L30.2 10.8 Z" fill="url(#jetBody)" filter="url(#glow)" />
  </g>
</svg>
